<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf7f4">
  <meta name="description" content="A dead-simple newborn tracker: feeds, diapers, baths and anything else, in one tap.">
  <title>Ultimate Baby Tracker</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/app.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar" id="chrome"></header>

  <main id="view">
    <div class="wrap">
      <div class="empty" style="padding-top:80px">
        <span class="big">🍼</span>
        Warming the bottle…
      </div>
    </div>
  </main>

  <div id="toasts" aria-live="polite"></div>

  <noscript>
    <div class="wrap"><div class="card">This tracker needs JavaScript enabled.</div></div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
